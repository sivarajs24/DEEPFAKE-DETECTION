# Video Model Configuration - EfficientNet-B3
model:
  architecture: efficientnet_b3
  pretrained: true
  num_classes: 2
  dropout: 0.3
  
training:
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_epochs: 50
  precision: 16  # Mixed precision (FP16)
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  
  # Optimizer
  optimizer: adamw
  
  # Learning Rate Scheduler
  scheduler:
    type: reduce_lr_on_plateau
    mode: min
    factor: 0.5
    patience: 3
    min_lr: 0.000001
    
  # Early Stopping
  early_stopping:
    monitor: val_loss
    patience: 7
    mode: min
    
data:
  train_path: data/faceforensics/train
  val_path: data/faceforensics/val
  test_path: data/faceforensics/test
  image_size: 224
  num_workers: 4
  pin_memory: true
  
  # Augmentations
  augmentation:
    horizontal_flip: 0.5
    random_brightness_contrast: 0.3
    random_gamma: 0.2
    gaussian_noise: 0.1
    motion_blur: 0.1
    jpeg_compression: [70, 100]
    
logging:
  logger: wandb  # Options: wandb, mlflow, tensorboard
  project_name: deepguard-x
  experiment_name: video_efficientnet_b3
  log_every_n_steps: 10
  
checkpoint:
  dirpath: checkpoints/video
  filename: efficientnet_b3_{epoch}_{val_loss:.4f}
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
  
export:
  onnx_path: models/video_efficientnet_b3.onnx
  opset_version: 14
  dynamic_axes: true
